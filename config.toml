# 设备远程控制配置
# 修改后重新启动程序生效；若配置缺失或格式错误，程序使用内置默认值

# 三轴行程范围 (mm)
[axis_limits]
[axis_limits.X]
min = -10.0
max = 230.0

[axis_limits.Y]
min = -5.0
max = 120.0

[axis_limits.Z]
min = -60.0
max = 125.0

# 自动循环 X 轴往返端点 (mm)
# 同时用于 X 轴预设中的"起始位置"/"终点位置"按钮
[auto_cycle]
x_home = 0.0
x_end = 200.0
x_end_withuv = 220.0
# 自动 UV 灯开启的 X 轴水平偏移 (mm)
uv_offset = 120.0
# 收到匹配的 PASS_REMAINING_ZERO 并发送 q 急停后的等待时间 (秒)
pass_stop_wait_seconds = 1.0

# 点动步长选项 (mm)，UI 中显示为单选按钮，默认选中第一个
[jog]
steps = [1, 5, 10, 50]

# Z 轴下降：每 layers 层（X 到达终点次数）下降 step (mm)
# 默认即"200 层 0.5mm"；触发阈值由 layers 直接决定
[z_step]
layers = 200
step = 0.5

# 闪喷：interval 为累计多少次 X 循环/急停后执行一次维护闪喷（仅在此处设置）
# pause_ms 为维护闪喷时在终点暂停的时长 (ms)
# x_offset 为开启维护闪喷前 X 轴正向偏移量 (mm)
[flash]
interval = 10
pause_ms = 2000
x_offset=20

# 压墨：勾选"自动压墨"时，自动循环闪喷前执行：
#   Z 下降 z_drop → 发送 PRESS_INK <所选时长> 秒 → 循环播放 warning.mp3 并弹窗"请手动刮墨"
#   → 点击确定后 Z 上升 z_drop → 继续闪喷
# z_drop: 刮墨时 Z 轴下降/回升量 (mm)
# durations: 压墨时长可选值 (s)，压墨按钮右侧的预设按钮可切换
# press_z: Z 轴预设"压墨高度" (mm)，点击 Z 轴预设按钮移动到该高度
[press_ink]
z_drop = 80.0
durations = [2, 5, 10]
press_z = 70.0

# UI：整体缩放系数、窗口宽高（按缩放系数放大）
# 两列布局：左侧连接/服务/设备/日志，右侧轴控制，窗口加宽减高
# column_widths: 两列宽度 (逻辑像素) = [左列, 右列]，窗口拉宽时多余宽度分配给左列
[ui]
scale = 1.6
window_size = [660, 520]
column_widths = [300, 440]
